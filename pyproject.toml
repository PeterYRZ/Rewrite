[project]
name = "rewrite-engine"
version = "0.1.0"
description = "全文部分段落改写引擎"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
]

[project.scripts]
rewrite = "rewrite_engine.cli.main:main"
rewrite-eval = "rewrite_engine.cli.main:main_eval"
rewrite-server = "rewrite_engine.api.server:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewrite_engine"]
