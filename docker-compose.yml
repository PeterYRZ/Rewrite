version: "3.8"

services:
  backend:
    image: python:3.14-slim
    working_dir: /app
    command: >
      sh -c "
        pip install uv &&
        uv sync &&
        uv run rewrite-server
      "
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_PORT=${SERVER_PORT:-8000}
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port $${FRONTEND_PORT:-5173}"
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_PORT=${SERVER_PORT:-8000}
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
    restart: unless-stopped
